<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="icon" type="image/svg+xml" href="img/spotifylogoN.svg" />
	<title>WithMe - Message prive</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="style.css?v=20260418-desktop-compact1" />
</head>
<body>
	<header class="page-header">
		<div class="page-header-left">
			<div class="brand-inline">
				<span class="brand-glyph" aria-hidden="true">WM</span>
				<p class="eyebrow">WithMe</p>
			</div>
			<nav class="page-nav" aria-label="Navigation principale">
				<a href="index.html">Accueil</a>
				<a href="search.html">Recherche</a>
				<a class="mobile-only-nav" href="concert-mobile.html">Concerts</a>
				<a href="profile.html">Profil</a>
			</nav>
		</div>
		<div class="header-meta">
			<h1 id="dmChatTitle">Discussion privee</h1>
			<p class="header-sub">Discute avec ton ami en prive.</p>
		</div>
		<div class="header-actions">
			<button id="themeToggle" class="theme-toggle-btn" type="button">Sombre</button>
			<a id="authActionBtn" class="login-top-btn" href="login.html">Connexion</a>
		</div>
	</header>

	<main class="card chat-page dm-chat-shell">
		<div class="dm-chat-topbar">
			<div id="dmChatStatus" class="search-status">Chargement de la discussion...</div>
		</div>
		<section id="dmChatMessages" class="chat-messages dm-chat-messages dm-thread" aria-live="polite"></section>

		<form id="dmChatForm" class="chat-form dm-compose" novalidate>
			<input id="dmChatInput" class="search-input" type="text" maxlength="500" placeholder="Ecris un message prive" required />
			<button id="dmChatSendBtn" class="login-top-btn" type="submit">Envoyer</button>
		</form>
	</main>

	<script src="js/spotify-config.js?v=20260401-authfix4"></script>
	<script src="js/auth-client.js?v=20260401-authfix4"></script>
	<script src="js/header-auth.js?v=20260401-authfix4"></script>
	<script src="js/direct-chat.js?v=20260417-dm-api-fix"></script>
</body>
</html>
