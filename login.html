<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Connexion - Spoteur</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
	<style>
		:root {
			--bg-main: #05070b;
			--text: #f4f8ff;
			--muted: #9eacbf;
			--line: #2a3445;
			--accent: #1ed760;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: "Space Grotesk", sans-serif;
			color: var(--text);
			background:
				radial-gradient(circle at 20% 20%, #1b4a34 0, rgba(27, 74, 52, 0) 35%),
				radial-gradient(circle at 80% 10%, #153058 0, rgba(21, 48, 88, 0) 36%),
				var(--bg-main);
			padding: 20px;
		}

		.auth-card {
			width: 100%;
			max-width: 420px;
			padding: 22px;
			border-radius: 18px;
			background: linear-gradient(165deg, rgba(27, 35, 48, 0.92), rgba(15, 21, 30, 0.9));
			border: 1px solid rgba(255, 255, 255, 0.1);
			box-shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
		}

		h1 {
			margin: 0 0 6px;
			font-family: "Bebas Neue", sans-serif;
			font-size: 2rem;
			font-weight: 400;
			letter-spacing: 1px;
		}

		p {
			margin: 0 0 18px;
			color: var(--muted);
		}

		form {
			display: grid;
			gap: 10px;
		}

		input {
			width: 100%;
			padding: 11px;
			border-radius: 10px;
			border: 1px solid var(--line);
			background: rgba(11, 16, 24, 0.9);
			color: var(--text);
		}

		button,
		.back-link {
			display: inline-block;
			text-align: center;
			text-decoration: none;
			padding: 10px 12px;
			border-radius: 999px;
			font-weight: 700;
		}

		button {
			border: 0;
			cursor: pointer;
			background: linear-gradient(120deg, var(--accent), #5de79a);
			color: #04250f;
		}

		.back-link {
			margin-top: 10px;
			background: rgba(255, 255, 255, 0.12);
			color: var(--text);
		}
	</style>
</head>
<body>
	<section class="auth-card">
		<h1>Connexion</h1>
		<p>Connecte-toi avec Spotify pour recuperer ton pseudo automatiquement.</p>
		<form id="spotifyLoginForm">
			<button id="spotifyConnectBtn" type="submit">Se connecter avec Spotify</button>
		</form>
		<p id="statusText" aria-live="polite"></p>
		<p id="redirectInfo"></p>
		<a class="back-link" href="index.html">Retour au dashboard</a>
	</section>

	<script src="spotify-config.js?v=20260327"></script>
	<script>
		const spotifyLoginForm = document.getElementById("spotifyLoginForm");
		const statusText = document.getElementById("statusText");
		const redirectInfo = document.getElementById("redirectInfo");
		const SPOTIFY_CLIENT_ID = window.SPOTEUR_CONFIG?.spotifyClientId || "";
		const CURRENT_LOGIN_URI = `${window.location.origin}${window.location.pathname}`;
		const CONFIG_REDIRECT_URI = (window.SPOTEUR_CONFIG?.redirectUri || "").trim();
		const CONFIG_LOCAL_REDIRECT_URI = (window.SPOTEUR_CONFIG?.localRedirectUri || "").trim();
		const IS_LOCAL_HOST = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost";
		const SPOTIFY_REDIRECT_URI = (IS_LOCAL_HOST ? CONFIG_LOCAL_REDIRECT_URI : CONFIG_REDIRECT_URI) || CURRENT_LOGIN_URI;
		const POST_LOGIN_REDIRECT = (window.SPOTEUR_CONFIG?.postLoginRedirect || "index.html").trim() || "index.html";

		const COOKIE_MAX_AGE = 60 * 60 * 24 * 365;
		const OAUTH_TEMP_AGE = 60 * 15;

		function setCookie(name, value, maxAgeSeconds) {
			document.cookie = `${name}=${encodeURIComponent(value)}; path=/; max-age=${maxAgeSeconds}; SameSite=Lax`;
		}

		function getCookie(name) {
			const parts = document.cookie ? document.cookie.split("; ") : [];
			for (const part of parts) {
				const [key, ...rest] = part.split("=");
				if (key === name) {
					return decodeURIComponent(rest.join("="));
				}
			}
			return "";
		}

		function setStatus(message, isError = false) {
			statusText.textContent = message;
			statusText.style.color = isError ? "#ff9cab" : "#b9c7db";
		}

		function clearCookie(name) {
			document.cookie = `${name}=; path=/; max-age=0; SameSite=Lax`;
		}

		function randomString(length) {
			const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
			const values = crypto.getRandomValues(new Uint8Array(length));
			let result = "";
			for (const value of values) {
				result += chars[value % chars.length];
			}
			return result;
		}

		async function sha256(plain) {
			const encoder = new TextEncoder();
			const data = encoder.encode(plain);
			return crypto.subtle.digest("SHA-256", data);
		}

		function base64UrlEncode(arrayBuffer) {
			const bytes = new Uint8Array(arrayBuffer);
			let str = "";
			for (const b of bytes) {
				str += String.fromCharCode(b);
			}
			return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
		}

		async function createCodeChallenge(verifier) {
			const hashed = await sha256(verifier);
			return base64UrlEncode(hashed);
		}

		function getQueryParam(param) {
			return new URLSearchParams(window.location.search).get(param) || "";
		}

		async function startSpotifyLogin(clientId) {
			const verifier = randomString(64);
			const challenge = await createCodeChallenge(verifier);
			const state = randomString(24);

			sessionStorage.setItem("spoteur-code-verifier", verifier);
			sessionStorage.setItem("spoteur-oauth-state", state);
			setCookie("spoteur-code-verifier", verifier, OAUTH_TEMP_AGE);
			setCookie("spoteur-oauth-state", state, OAUTH_TEMP_AGE);

			const scope = encodeURIComponent(
				"user-read-email user-read-private user-top-read user-read-recently-played user-read-currently-playing user-read-playback-state user-modify-playback-state"
			);
			const authUrl = "https://accounts.spotify.com/authorize"
				+ `?response_type=code&client_id=${encodeURIComponent(clientId)}`
				+ `&redirect_uri=${encodeURIComponent(SPOTIFY_REDIRECT_URI)}`
				+ `&code_challenge_method=S256&code_challenge=${encodeURIComponent(challenge)}`
				+ `&state=${encodeURIComponent(state)}&scope=${scope}`;

			window.location.href = authUrl;
		}

		async function exchangeCodeForToken(code, clientId, verifier) {
			const body = new URLSearchParams({
				grant_type: "authorization_code",
				code,
				redirect_uri: SPOTIFY_REDIRECT_URI,
				client_id: clientId,
				code_verifier: verifier
			});

			const response = await fetch("https://accounts.spotify.com/api/token", {
				method: "POST",
				headers: { "Content-Type": "application/x-www-form-urlencoded" },
				body
			});

			if (!response.ok) {
				let detail = "";
				try {
					const errPayload = await response.json();
					detail = errPayload.error_description || errPayload.error || "";
				} catch (e) {
					detail = "";
				}
				throw new Error(`Echec pendant la recuperation du token Spotify.${detail ? ` ${detail}` : ""}`);
			}

			return response.json();
		}

		async function fetchSpotifyProfile(accessToken) {
			const response = await fetch("https://api.spotify.com/v1/me", {
				headers: { Authorization: `Bearer ${accessToken}` }
			});

			if (!response.ok) {
				throw new Error("Impossible de recuperer le profil Spotify.");
			}

			return response.json();
		}

		async function handleSpotifyCallback() {
			const code = getQueryParam("code");
			const error = getQueryParam("error");
			const state = getQueryParam("state");

			if (error) {
				if (error === "invalid_redirect_uri") {
					setStatus(`Redirect URI invalide. Mets exactement cette URL dans Spotify Dashboard: ${SPOTIFY_REDIRECT_URI}`, true);
					return;
				}
				setStatus("Connexion Spotify annulee ou refusee.", true);
				return;
			}

			if (!code) {
				return;
			}

			try {
				setStatus("Connexion Spotify en cours...");
				const expectedState = sessionStorage.getItem("spoteur-oauth-state") || getCookie("spoteur-oauth-state");
				if (!expectedState || expectedState !== state) {
					throw new Error("Etat OAuth invalide, recommence la connexion.");
				}

				const verifier = sessionStorage.getItem("spoteur-code-verifier") || getCookie("spoteur-code-verifier");
				const clientId = SPOTIFY_CLIENT_ID;
				if (!verifier || !clientId || clientId === "REPLACE_WITH_YOUR_SPOTIFY_CLIENT_ID") {
					throw new Error("Session de connexion expiree, reconnecte-toi.");
				}

				const tokenData = await exchangeCodeForToken(code, clientId, verifier);
				const profile = await fetchSpotifyProfile(tokenData.access_token);
				const displayName = profile.display_name || profile.id || "Utilisateur";

				setCookie("spoteur-display-name", displayName, COOKIE_MAX_AGE);
				try {
					localStorage.setItem("spoteur-display-name", displayName);
					localStorage.setItem("spoteur-spotify-access-token", tokenData.access_token || "");
					localStorage.setItem("spoteur-spotify-refresh-token", tokenData.refresh_token || "");
					localStorage.setItem("spoteur-spotify-expires-at", String(Date.now() + ((tokenData.expires_in || 3600) * 1000)));
				} catch (e) {}
				sessionStorage.removeItem("spoteur-code-verifier");
				sessionStorage.removeItem("spoteur-oauth-state");
				clearCookie("spoteur-code-verifier");
				clearCookie("spoteur-oauth-state");

				history.replaceState({}, document.title, SPOTIFY_REDIRECT_URI);
				setStatus(`Connecte: ${displayName}. Redirection vers l'accueil...`);

				setTimeout(() => {
					window.location.href = POST_LOGIN_REDIRECT;
				}, 700);
			} catch (err) {
				setStatus(err.message || "Connexion Spotify impossible.", true);
			}
		}

		spotifyLoginForm.addEventListener("submit", async (event) => {
			event.preventDefault();
			if (!SPOTIFY_CLIENT_ID || SPOTIFY_CLIENT_ID === "REPLACE_WITH_YOUR_SPOTIFY_CLIENT_ID") {
				setStatus("Configure d'abord spotifyClientId dans spotify-config.js.", true);
				return;
			}

			if (!SPOTIFY_REDIRECT_URI) {
				setStatus("Configure redirectUri dans spotify-config.js.", true);
				return;
			}

			setStatus("Redirection vers Spotify...");
			await startSpotifyLogin(SPOTIFY_CLIENT_ID);
		});

		redirectInfo.textContent = `Redirect URI Spotify utilisee: ${SPOTIFY_REDIRECT_URI}`;

		handleSpotifyCallback();
	</script>
</body>
</html>
